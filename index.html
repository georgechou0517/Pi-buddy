/* 动效：统一缓动 + 入场动画 */
button, .nav-item, .list-item, .preset, .artifact, .tool-row, .chip, .pop-item, .btn, .tab, .model-btn {
  transition: background-color .16s ease, color .16s ease, border-color .16s ease, transform .16s ease;
}
@keyframes popIn{from{opacity:0;transform:translateY(5px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes bubbleIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes softPulse{50%{opacity:.4}}
.pop{animation:popIn .16s cubic-bezier(.2,.8,.3,1)}
.msg{animation:bubbleIn .2s ease-out}
.att{animation:popIn .15s ease-out}
#welcome,#chat{animation:fadeIn .18s ease-out}
.panel{animation:fadeIn .16s ease-out}
.send-btn{transition:background-color .18s ease,transform .1s ease}
.send-btn:active{transform:scale(.9)}
.new-task:active{transform:scale(.98)}
.preset:hover{transform:translateY(-1px)}
.preset:active{transform:translateY(0) scale(.98)}
.artifact:hover{transform:translateY(-1px)}
.nav-item:active,.pop-item:active{transform:scale(.985)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.6;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent)}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d9d9d4;border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#c2c2bc;border:3px solid transparent;background-clip:content-box}

/* 布局 */
.app{position:relative;display:flex;height:100vh}
.sidebar{position:relative;flex:0 0 var(--sidebar-w,252px);width:var(--sidebar-w,252px);background:var(--bg-side);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px 10px;gap:4px;overflow:hidden;transition:width .28s cubic-bezier(.4,0,.2,1),flex-basis .28s cubic-bezier(.4,0,.2,1),padding .28s cubic-bezier(.4,0,.2,1),border-right-width .28s cubic-bezier(.4,0,.2,1),opacity .22s ease,border-right-color .28s ease}
.main{position:relative;flex:1;min-width:0;display:flex;flex-direction:column}
/* 内容保持原宽度，只被 overflow 裁切，收缩时不会挤压换行 */
.sidebar > *{min-width:calc(var(--sidebar-w,252px) - 20px);flex-shrink:0}
.sidebar.collapsed{width:0;flex-basis:0;padding-left:0;padding-right:0;border-right-width:0;opacity:0;border-right-color:transparent;pointer-events:none}
body.resizing .sidebar{transition:none}
.sidebar-toggle{position:absolute;left:10px;top:10px;z-index:30;width:28px;height:28px;display:grid;place-items:center;padding:0;border:0;border-radius:8px;background:transparent;color:var(--text-2);cursor:pointer;transition:background .15s,color .15s}
.sidebar-toggle:hover{background:var(--bg-hover);color:var(--text)}
.sidebar-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sidebar-toggle svg{width:16px;height:16px}
.sidebar-toggle.collapsed{background:var(--bg-hover);color:var(--text)}

.sidebar-resizer{position:absolute;top:0;left:var(--sidebar-w,252px);width:9px;height:100%;transform:translateX(-4px);cursor:col-resize;z-index:20}
.sidebar-resizer::after{content:'';position:absolute;top:0;left:4px;width:2px;height:100%;background:transparent;transition:background .15s}
.sidebar-resizer:hover::after,.sidebar-resizer.dragging::after{background:var(--accent)}
.sidebar-resizer.hidden{display:none}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none!important}

/* 侧栏 */
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 12px}
/* 左上角让位给侧栏切换按钮；保留占位使 Pi-buddy 文字不位移 */
.brand-mark{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:600;font-family:var(--mono);visibility:hidden}
.brand-name{font-family:'PibuddyPixel',var(--font);font-size:13px;font-weight:400;letter-spacing:.6px;line-height:1.5}
.brand-ver{font-family:'PibuddyPixel',var(--mono);font-size:10px;color:var(--text-3);margin-left:auto;letter-spacing:.4px}
.new-task{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:9px;background:var(--bg);font-weight:500;margin-bottom:8px}
.new-task:hover{background:var(--bg-hover)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:8px;color:var(--text-2);text-align:left}
.nav-item:hover{background:var(--bg-hover);color:var(--text)}
.nav-item.active{background:var(--bg-hover);color:var(--text);font-weight:500}
.nav-item[disabled]{opacity:.42;cursor:not-allowed}
.nav-item[disabled]:hover{background:none;color:var(--text-2)}
.nav-item svg{flex:0 0 16px;opacity:.8}
.nav-badge{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:999px;background:var(--bg-hover);color:var(--text-3)}
.side-scroll{flex:1;overflow:auto;margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.list-head{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text-3);padding:8px 10px 4px;letter-spacing:.3px}
.list-empty{font-size:12px;color:var(--text-3);padding:4px 10px 10px}
.list-item{display:block;width:100%;text-align:left;padding:6px 10px;border-radius:7px;color:var(--text-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item:hover{background:var(--bg-hover);color:var(--text)}
.list-item.active{background:var(--bg-hover);color:var(--text);font-weight:500}
.list-item.pinned{color:var(--text);font-weight:500}
.pin-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:middle}
.space-row{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:7px;font-size:13px;color:var(--text-2)}
.space-row:hover{background:var(--bg-hover);color:var(--text)}
.space-row .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.space-row .x{opacity:0;font-size:12px;color:var(--text-3);padding:0 2px}
.space-row:hover .x{opacity:1}

/* 欢迎态：整体垂直居中，输入框落在页面中部 */
.main.welcome-mode{justify-content:center}
.main.welcome-mode .stage{flex:0 0 auto;overflow:visible}
.main.welcome-mode .welcome{flex:0 0 auto;padding:0 24px 16px}
.main.welcome-mode .composer-wrap{padding:0 20px}
.main.welcome-mode #samples{display:flex}

.samples{position:relative;z-index:1;display:none;flex-direction:column;align-items:flex-start;gap:7px;width:100%;max-width:900px;margin:0 auto;padding:13px 20px 0}
.sample{display:flex;align-items:flex-start;gap:9px;text-align:left;padding:9px 13px;border:1px solid var(--border);border-radius:12px;background:var(--bg-soft);color:var(--text-2);font-size:13px;line-height:1.55;max-width:100%;width:fit-content;transition:background-color .16s ease,border-color .16s ease,color .16s ease,transform .16s ease;animation:popIn .22s ease-out}
.sample:hover{background:var(--bg);border-color:var(--accent-line);color:var(--text);transform:translateY(-1px)}
.sample:active{transform:translateY(0) scale(.995)}
.sample .s-emoji{flex:0 0 auto;font-size:12.5px;opacity:.75;margin-top:1px}
.sample .s-text{flex:1;min-width:0}
.sample .s-go{flex:0 0 auto;width:15px;height:15px;color:var(--text-2);margin-top:1px;transition:color .15s ease,transform .15s ease}
.sample:hover .s-go{color:var(--accent);transform:translate(1.5px,-1.5px)}

/* 欢迎态 */
.stage{position:relative;z-index:1;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.welcome{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px 24px 8px}
/* 首页标志：尺寸由 JS 按「页面顶到输入框垂直中线」实测计算；图片等比缩放、贴右上角 */
.home-logo{position:absolute;top:0;right:0;width:200px;height:200px;z-index:0;pointer-events:none;display:flex;justify-content:flex-end;align-items:flex-start}
.home-logo img{width:100%;height:100%;object-fit:contain;object-position:right top;display:block;opacity:.92;user-select:none}
/* 点击播放模式：容器可点、右下角给一个播放角标 */
.home-logo.clickable{pointer-events:auto;cursor:pointer}
.home-logo.clickable img{pointer-events:auto}
.home-logo.clickable::after{content:'\25B6';position:absolute;right:10px;bottom:10px;width:26px;height:26px;border-radius:50%;background:rgba(31,31,29,.55);color:#fff;font-size:11px;line-height:26px;text-align:center;pointer-events:none}
.home-logo.playing::after{display:none}
.welcome h1{margin:0;font-size:34px;font-weight:500;letter-spacing:1.5px;text-align:center;font-family:'PibuddyPixel',"Microsoft YaHei",var(--font);text-shadow:2px 2px 0 rgba(31,31,29,.09)}
.welcome p{margin:0;color:var(--text-2);font-size:14px}
/* 没装 Pi 时的引导卡片 */
.pi-missing{width:100%;max-width:640px;border:1px solid var(--danger);border-radius:12px;background:var(--danger-soft);padding:14px 16px;text-align:left}
.pi-missing .pm-title{font-size:14px;font-weight:600;color:var(--danger);margin-bottom:4px}
.pi-missing .pm-text{font-size:12.5px;color:var(--text-2);line-height:1.7;margin-bottom:10px}
.pi-missing code{display:block;font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:10px;word-break:break-all;user-select:all}
.pi-missing .pm-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.presets{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.preset{display:flex;align-items:center;gap:8px;padding:10px 22px;border:1px solid var(--border);border-radius:999px;background:var(--bg);transition:border-color .15s,background .15s}
.preset .emoji{font-size:17px;line-height:1}
.preset span{font-weight:500;font-size:14px}
.preset:hover{border-color:var(--border-strong);background:var(--bg-soft)}
.preset.active{background:var(--accent-soft);border-color:var(--accent-line)}

/* 对话态 */
.chat{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--bg);flex:0 0 auto}
.chat-title{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.chat-sub{font-size:11px;color:var(--text-3)}
.chat-head .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--border);color:var(--text-2);background:var(--bg-soft)}
.pill.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent)}
.pill.warn{border-color:#f0c9c9;background:var(--danger-soft);color:var(--danger)}
.messages{flex:1;overflow:auto;padding:22px 22px 8px;display:flex;flex-direction:column;gap:14px}

/* 气泡 */
.msg{display:flex;gap:9px;max-width:100%}
.msg.user{justify-content:flex-end}
.msg-avatar{flex:0 0 26px;width:26px;height:26px;border-radius:8px;background:var(--bg-soft);border:1px solid var(--border);display:grid;place-items:center;font-size:12px;color:var(--text-2);margin-top:2px}
.bubble{position:relative;max-width:min(760px,86%);padding:10px 14px;border-radius:14px;font-size:14px;word-break:break-word;overflow-wrap:anywhere}
.msg.user .bubble{background:var(--user-bubble);border:1px solid var(--user-line);border-bottom-right-radius:4px}
.msg.ai .bubble{background:var(--bg-soft);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.ai .bubble:only-child{margin-left:0}
.bubble .plain{white-space:pre-wrap}
.cursor{display:inline-block;width:7px;height:15px;background:var(--text-2);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.msg-tools{display:flex;flex-direction:column;gap:4px;margin-bottom:2px;max-width:min(760px,86%)}
.tools-head{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);padding:4px 9px;border-radius:8px;background:var(--bg-soft);border:1px solid var(--border);width:fit-content;max-width:100%;transition:background-color .15s,border-color .15s}
.tools-head:hover{background:var(--bg-hover);border-color:var(--border-strong);color:var(--text)}
.tools-head svg{flex:0 0 12px;opacity:.7}
.tools-head .chev{margin-left:2px;font-size:9px;color:var(--text-3);transition:transform .18s ease}
.msg-tools.collapsed .chev{transform:rotate(-90deg)}
.tools-body{display:flex;flex-direction:column;gap:4px;padding-left:2px;animation:fadeIn .15s ease-out}
.msg-tools.collapsed .tools-body{display:none}
.msg-actions{display:flex;gap:3px;margin-top:-2px}
.msg-actions .act{width:27px;height:25px;border-radius:7px;display:grid;place-items:center;font-size:13px;line-height:1;opacity:.5;transition:opacity .15s ease,background-color .15s ease,transform .1s ease}
.msg-actions .act:hover{opacity:1;background:var(--bg-hover)}
.msg-actions .act:active{transform:scale(.92)}
.tool-row{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);padding:3px 8px;border-radius:7px;background:var(--bg-soft);border:1px solid var(--border);width:fit-content;max-width:100%}
.tool-row .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.tool-row.err .dot{background:var(--danger)}
.tool-row .name{font-family:var(--mono);font-size:11px;color:var(--text)}
.tool-row .arg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px;color:var(--text-3)}
.tool-row .ms{margin-left:auto;font-size:11px;color:var(--text-3)}

/* 产物卡牌 */
.artifacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;max-width:min(760px,86%)}
.artifact{display:flex;align-items:center;gap:10px;width:250px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:var(--bg);text-align:left;transition:border-color .15s,background .15s}
.artifact:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.artifact .ico{width:30px;height:30px;border-radius:8px;background:var(--bg-soft);display:grid;place-items:center;font-size:10px;font-family:var(--mono);color:var(--text-2);text-transform:uppercase;flex:0 0 30px}
.artifact .meta{min-width:0;flex:1}
.artifact .nm{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artifact .sz{font-size:11px;color:var(--text-3)}
.artifact .go{color:var(--text-3);font-size:13px}
.artifact:hover .go{color:var(--accent)}

/* 输入区 */
.composer-wrap{position:relative;z-index:2;flex:0 0 auto;padding:6px 20px 12px;width:100%;max-width:900px;margin:0 auto}
.attachments{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:7px}
.att{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--border);border-radius:8px;background:var(--bg-soft);font-size:12px;max-width:240px}
.att img{width:22px;height:22px;object-fit:cover;border-radius:5px}
.att .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .x{color:var(--text-3);font-size:13px;padding:0 1px}
.att .x:hover{color:var(--danger)}
.composer{border:1px solid var(--border-strong);border-radius:14px;background:var(--bg);padding:9px 11px 7px;transition:border-color .15s,box-shadow .15s}
.composer.focus{border-color:var(--accent-line);box-shadow:0 0 0 3px rgba(15,110,86,.08)}
.composer.drag{border-style:dashed;border-color:var(--accent);background:var(--accent-soft)}
#input{width:100%;border:0;outline:0;resize:none;min-height:46px;max-height:190px;line-height:1.62;background:transparent;padding:2px 0}
#input::placeholder{color:var(--text-3)}
.composer-bar{display:flex;align-items:center;gap:6px;margin-top:4px}
.icon-btn{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;color:var(--text-2);flex:0 0 29px}
.icon-btn:hover{background:var(--bg-hover);color:var(--text)}
.icon-btn.on{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden}
.chip{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);white-space:nowrap;max-width:180px}
.chip .t{overflow:hidden;text-overflow:ellipsis}
.chip .x{opacity:.7;font-size:12px}
.chip .x:hover{opacity:1}
.chip.ghost{background:var(--bg-soft);border-color:var(--border);color:var(--text-3)}
.spacer{flex:1}
.model-btn{display:flex;align-items:center;gap:5px;font-size:12px;padding:4px 9px;border-radius:8px;border:1px solid var(--border);color:var(--text-2);max-width:190px;white-space:nowrap;overflow:hidden}
.model-btn:hover{background:var(--bg-hover);color:var(--text)}
.model-btn .nm{overflow:hidden;text-overflow:ellipsis}
.model-btn .cv{color:var(--text-3);font-size:10px}
.send-btn{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:0 0 30px}
.send-btn:hover{background:#0b5a46}
.send-btn[disabled]{background:var(--border-strong);cursor:not-allowed}
.send-btn.stop{background:var(--danger)}
.send-btn.stop:hover{background:#8b2626}
.composer-foot{display:flex;align-items:center;gap:14px;padding:7px 3px 0;font-size:12px;color:var(--text-3)}
.foot-btn{display:flex;align-items:center;gap:5px;color:var(--text-3);font-size:12px;padding:2px 4px;border-radius:6px}
.foot-btn:hover{color:var(--text)}
.foot-btn.set{color:var(--accent)}
.foot-btn .path{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch{display:flex;align-items:center;gap:6px;cursor:pointer;margin-left:auto;font-size:12px;color:var(--text-3)}
.switch input{appearance:none;width:30px;height:17px;border-radius:999px;background:var(--border-strong);position:relative;cursor:pointer;transition:background .15s;flex:0 0 30px}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(13px)}
.switch.on{color:var(--accent)}
.cbx{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1px solid var(--border-strong);border-radius:4px;background:#fff;position:relative;cursor:pointer;flex:0 0 16px;margin:0;transition:background-color .15s ease,border-color .15s ease}
.cbx:hover{border-color:var(--accent-line)}
.cbx:checked{background:var(--accent);border-color:var(--accent)}
.cbx:checked::after{content:"";position:absolute;left:4px;top:1px;width:4.5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cbx:focus-visible{outline:2px solid var(--accent-line);outline-offset:2px}
.limit-custom{display:none;margin-top:6px}

/* 弹层 */
.pop{position:fixed;z-index:60;background:var(--bg);border:1px solid var(--border-strong);border-radius:12px;box-shadow:0 8px 28px rgba(20,20,18,.13);padding:6px;min-width:200px;max-height:min(60vh,420px);overflow:auto}
.pop-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:8px;text-align:left;font-size:13px;color:var(--text-2)}
.pop-item:hover{background:var(--bg-hover);color:var(--text)}
.pop-item.active{color:var(--accent);background:var(--accent-soft)}
.pop-item.danger{color:var(--danger)}
.pop-item.danger:hover{background:var(--danger-soft);color:var(--danger)}
.pop-item .sub{margin-left:auto;font-size:11px;color:var(--text-3);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-item .arrow{margin-left:auto;color:var(--text-3);font-size:11px}
.pop-sep{height:1px;background:var(--border);margin:5px 4px}
.pop-title{font-size:11px;color:var(--text-3);padding:6px 10px 3px}
.pop-sub{position:relative}
.pop-sub>.pop-item .arrow{margin-left:auto;color:var(--text-3);font-size:10px}
.pop-sub>.pop{padding:5px}
.empty-tip{padding:10px;font-size:12px;color:var(--text-3);line-height:1.6}

/* 面板 */
.panel{flex:1;overflow:auto;padding:26px 30px 40px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.panel-head h2{margin:0;font-size:19px;font-weight:600}
.panel-head .spacer{flex:1}
.panel-desc{color:var(--text-2);font-size:13px;margin:0 0 20px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px}
.tab{padding:7px 12px;font-size:13px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.card{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--bg);margin-bottom:10px}
.card-row{display:flex;align-items:flex-start;gap:12px}
.card-row .grow{flex:1;min-width:0}
.card-title{font-weight:500;font-size:14px}
.card-sub{font-size:12px;color:var(--text-2);margin-top:2px;word-break:break-all}
.card-actions{display:flex;gap:6px;flex:0 0 auto}
.btn{font-size:12.5px;padding:5px 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg);color:var(--text-2)}
.btn:hover{background:var(--bg-hover);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0b5a46}
.btn.danger{color:var(--danger);border-color:#ecc9c9}
.btn.danger:hover{background:var(--danger-soft)}
.btn.sm{padding:3px 9px;font-size:12px}
.row-line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.row-line:last-child{border-bottom:0}
.row-line .grow{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.field>label{font-size:12px;color:var(--text-2)}
.field input[type=text],.field input[type=time],.field input[type=number],.field select,.field textarea{padding:7px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--bg);outline:0;font-size:13px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px rgba(15,110,86,.07)}
.field textarea{resize:vertical;min-height:74px;line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.file-item{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px}
.file-item:hover{background:var(--bg-soft)}
.file-item .ico{width:26px;height:26px;border-radius:7px;background:var(--bg-soft);display:grid;place-items:center;font-size:9px;font-family:var(--mono);color:var(--text-2);text-transform:uppercase;flex:0 0 26px}
.file-item .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .meta{font-size:11px;color:var(--text-3)}
.note{font-size:12px;color:var(--text-2);background:var(--bg-soft);border:1px solid var(--border);border-radius:9px;padding:9px 12px;line-height:1.65}
.logo-preview{display:flex;align-items:center;justify-content:center;height:104px;border:1px dashed var(--border-strong);border-radius:10px;background:var(--bg-soft);overflow:hidden;padding:8px}
.logo-preview img{max-width:100%;max-height:88px;object-fit:contain;display:block}
.note strong{font-weight:500;color:var(--text)}
.notice{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-soft);color:var(--text-2);max-width:min(760px,86%);line-height:1.55}
.notice.warn{border-color:#efdfb2;background:#fdf7e8;color:#8a6416}
.notice.error{border-color:#ecc9c9;background:var(--danger-soft);color:var(--danger)}
.search{width:100%;padding:8px 11px;border:1px solid var(--border-strong);border-radius:9px;font-size:13px;outline:0;margin-bottom:12px}
.search:focus{border-color:var(--accent-line)}

/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:#23231f;color:#fff;font-size:12.5px;padding:8px 16px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:70vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* markdown */
.md h1,.md h2,.md h3,.md h4{margin:14px 0 7px;line-height:1.35;font-weight:600}
.md h1{font-size:19px}
.md h2{font-size:17px}
.md h3{font-size:15px}
.md h4{font-size:14px}
.md p{margin:7px 0}
.md ul,.md ol{margin:7px 0;padding-left:22px}
.md li{margin:3px 0}
.md blockquote{margin:8px 0;padding:2px 12px;border-left:3px solid var(--border-strong);color:var(--text-2)}
.md hr{border:0;border-top:1px solid var(--border);margin:14px 0}
.md code{font-family:var(--mono);font-size:12.5px;background:rgba(20,20,18,.06);padding:1.5px 5px;border-radius:5px}
.md pre.code{margin:10px 0;border:1px solid var(--border);border-radius:10px;background:#fbfbfa;overflow:hidden}
.md pre.code .code-head{display:flex;align-items:center;justify-content:space-between;padding:5px 11px;border-bottom:1px solid var(--border);font-size:11px;color:var(--text-3);font-family:var(--mono)}
.md pre.code .copy{font-size:11px;color:var(--text-3)}
.md pre.code .copy:hover{color:var(--text)}
.md pre.code code{display:block;padding:10px 12px;overflow:auto;background:none;font-size:12.5px;line-height:1.62;white-space:pre}
.md table{border-collapse:collapse;margin:10px 0;font-size:13px;display:block;overflow:auto;max-width:100%}
.md th,.md td{border:1px solid var(--border);padding:5px 10px;text-align:left}
.md th{background:var(--bg-soft);font-weight:500}
.md a{text-decoration:underline;text-underline-offset:2px}
.md img{max-width:100%}
.md .k{color:#9a3f9a}
.md .s{color:#0f6e56}
.md .c{color:#8f8f88;font-style:italic}
.md .n{color:#185fa5}
@media (max-width:820px){
  .welcome h1{font-size:28px}
  .bubble{max-width:92%}
}
</style>
</head>
<body>
<div class="app">
  <button class="sidebar-toggle" id="sidebarToggle" type="button" title="收起侧边栏" aria-label="收起侧边栏" aria-expanded="true">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false">
      <path d="M2.5 4a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1m2-.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0m1 .5a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1"/>
      <path d="M2 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm12 1a1 1 0 0 1 1 1v2H1V3a1 1 0 0 1 1-1zM1 13V6h4v8H2a1 1 0 0 1-1-1m5 1V6h9v7a1 1 0 0 1-1 1z"/>
    </svg>
  </button>

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">&#960;</div>
      <div class="brand-text">
        <div class="brand-name">Pi-buddy</div>
      </div>
      <div class="brand-ver" id="verText">v26.11.1</div>
    </div>

    <button class="new-task" id="btnNew">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>新建任务</span>
    </button>

    <nav class="nav" id="nav">
      <button class="nav-item" data-view="assistant" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
        <span>助理</span><span class="nav-badge">待做</span>
      </button>
      <button class="nav-item" data-view="hub">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.4 5.2L20 10l-5.6 1.8L12 17l-2.4-5.2L4 10l5.6-1.8z"/></svg>
        <span>专家 · 技能 · 连接器</span>
      </button>
      <button class="nav-item" data-view="cron">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.6V12l3 1.8"/></svg>
        <span>定时任务</span>
      </button>
      <button class="nav-item" data-view="library">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M14 4h4.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H14z"/></svg>
        <span>资料库</span>
      </button>
      <button class="nav-item" data-view="more" id="btnMore">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
        <span>更多</span>
      </button>
    </nav>

    <div class="side-scroll">
      <div class="list-head"><span>任务</span></div>
      <div id="taskList"><div class="list-empty">还没有任务</div></div>
      <div class="list-head"><span>空间</span><button class="btn sm" id="btnAddSpace" style="padding:0 6px;border:0;color:var(--text-3)">+</button></div>
      <div id="spaceList"><div class="list-empty">未挂载文件夹</div></div>
    </div>
  </aside>
  <div class="sidebar-resizer" id="sidebarResizer" title="拖动调整侧边栏宽度" role="separator" aria-orientation="vertical" aria-label="拖动调整侧边栏宽度"></div>

  <main class="main">
    <div class="home-logo hidden" id="homeLogo" aria-hidden="true">
      <img id="homeLogoImg" alt="" draggable="false" />
    </div>

    <div class="stage" id="stage">
      <section class="welcome" id="welcome">
        <h1>Pi-buddy，我帮你</h1>
        <p>选一个场景开始，或者直接输入你的问题</p>
        <div class="pi-missing hidden" id="piMissing"></div>
        <div class="presets" id="presets"></div>
      </section>

      <section class="chat hidden" id="chat">
        <div class="chat-head">
          <div style="min-width:0">
            <div class="chat-title" id="chatTitle">新任务</div>
            <div class="chat-sub" id="chatSub"></div>
          </div>
          <div class="right">
            <span class="pill" id="mdPill">Markdown 输出</span>
            <span class="pill" id="modePill">Agent</span>
            <button class="btn sm" id="btnAbort">停止</button>
          </div>
        </div>
        <div class="messages" id="messages"></div>

'use strict';

/* ---------------------------------------------------------------- 基础工具 */

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, ch => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
  ));
}

function toast(message, ms) {
  const node = $('#toast');
  node.textContent = message;
  node.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => node.classList.remove('show'), ms || 2600);
}

function relTime(ms) {
  const diff = Date.now() - ms;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
  if (diff < 86400000 * 7) return Math.floor(diff / 86400000) + ' 天前';
  const d = new Date(ms);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

async function api(path, options) {
  const opts = Object.assign({ headers: {} }, options || {});
  if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof Blob)) {
    opts.body = JSON.stringify(opts.body);
    opts.headers['Content-Type'] = 'application/json';
  }
  const res = await fetch(path, opts);
  let data;
  try { data = await res.json(); } catch { data = { ok: false, error: 'HTTP ' + res.status }; }
  if (!res.ok || data.ok === false) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

/* ---------------------------------------------------------------- 代码高亮 */

const KEYWORDS = new Set(('const let var function return if else for while do class new import export default from async await ' +
  'try catch finally throw typeof instanceof switch case break continue delete in of this super extends implements interface ' +
  'type enum public private protected readonly static void yield def elif lambda pass with as is not and or None True False ' +
  'null undefined true false int float str bool double char struct impl fn use mod pub match loop where some none self ' +
  'select from where insert update delete create table join on group order by limit').split(' '));

function highlight(code, lang) {
  const known = ['js', 'jsx', 'ts', 'tsx', 'json', 'py', 'python', 'sh', 'bash', 'sql', 'css', 'html', 'c', 'cpp', 'go', 'rs'];
  const key = String(lang || '').toLowerCase();
  if (!known.includes(key)) return escapeHtml(code);

  const source = String(code);
  const n = source.length;
  let out = '';
  let i = 0;

  while (i < n) {
    const ch = source[i];

    if (ch === '/' && source[i + 1] === '/') {
      let j = source.indexOf('\n', i);
      if (j === -1) j = n;
      out += '<span class="c">' + escapeHtml(source.slice(i, j)) + '</span>';
      i = j;
      continue;
    }
    if (ch === '/' && source[i + 1] === '*') {
      let j = source.indexOf('*/', i + 2);
      j = j === -1 ? n : j + 2;
      out += '<span class="c">' + escapeHtml(source.slice(i, j)) + '</span>';
      i = j;
      continue;
    }
    if (ch === '#' && ['py', 'python', 'sh', 'bash'].includes(key)) {
      let j = source.indexOf('\n', i);
      if (j === -1) j = n;
      out += '<span class="c">' + escapeHtml(source.slice(i, j)) + '</span>';
      i = j;
      continue;
    }
    if (ch === '"' || ch === "'" || ch === '`') {
      let j = i + 1;
      while (j < n) {
        if (source[j] === '\\') { j += 2; continue; }
        if (source[j] === ch) { j += 1; break; }
        if (source[j] === '\n' && ch !== '`') break;
        j += 1;
      }
      out += '<span class="s">' + escapeHtml(source.slice(i, j)) + '</span>';
      i = j;
      continue;
    }
    if (/[0-9]/.test(ch)) {
      let j = i;
      while (j < n && /[0-9a-fA-FxX._]/.test(source[j])) j += 1;
      out += '<span class="n">' + escapeHtml(source.slice(i, j)) + '</span>';
      i = j;
      continue;
    }
    if (/[A-Za-z_$]/.test(ch)) {
      let j = i;
      while (j < n && /[A-Za-z0-9_$]/.test(source[j])) j += 1;
      const word = source.slice(i, j);
      out += KEYWORDS.has(word) ? '<span class="k">' + escapeHtml(word) + '</span>' : escapeHtml(word);
      i = j;
      continue;
    }
    out += escapeHtml(ch);
    i += 1;
  }
  return out;
}

/* ---------------------------------------------------------------- Markdown */

function inlineMd(text) {
  let s = escapeHtml(text);
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
  s = s.replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  return s;
}

function splitRow(line) {
  const trimmed = line.trim().replace(/^\|/, '').replace(/\|$/, '');
  return trimmed.split('|').map(cell => cell.trim());
}

function renderMarkdown(source) {
  const lines = String(source == null ? '' : source).replace(/\r\n/g, '\n').split('\n');
  const out = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    if (/^\s*```/.test(line)) {
      const lang = line.trim().slice(3).trim();
      const buf = [];
      i += 1;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i += 1; }
      i += 1;
      out.push('<pre class="code"><div class="code-head"><span>' + escapeHtml(lang || 'text') +
        '</span><button class="copy" data-copy="1">复制</button></div><code>' +
        highlight(buf.join('\n'), lang) + '</code></pre>');
      continue;
    }

    const heading = line.match(/^(#{1,4})\s+(.*)$/);
    if (heading) {
      const level = heading[1].length;
      out.push('<h' + level + '>' + inlineMd(heading[2]) + '</h' + level + '>');
      i += 1;
      continue;
    }

    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out.push('<hr>'); i += 1; continue; }

    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|\-]+\|\s*$/.test(lines[i + 1])) {
      const head = splitRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(splitRow(lines[i])); i += 1; }
      let table = '<table><thead><tr>' + head.map(c => '<th>' + inlineMd(c) + '</th>').join('') + '</tr></thead><tbody>';
      for (const row of rows) {
        table += '<tr>' + row.map(c => '<td>' + inlineMd(c) + '</td>').join('') + '</tr>';
      }
      out.push(table + '</tbody></table>');
      continue;
    }

    if (/^\s*>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i += 1; }
      out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
      continue;
    }

    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, ''));
        i += 1;
      }
      const tag = ordered ? 'ol' : 'ul';
      out.push('<' + tag + '>' + items.map(t => '<li>' + inlineMd(t) + '</li>').join('') + '</' + tag + '>');
      continue;
    }

    if (!line.trim()) { i += 1; continue; }

    const buf = [line];
    i += 1;
    while (i < lines.length && lines[i].trim() &&
      !/^\s*(#{1,4}\s|```|>\s?|([-*+]|\d+\.)\s)/.test(lines[i]) &&
      !/^\s*\|.*\|\s*$/.test(lines[i])) {
      buf.push(lines[i]);
      i += 1;
    }
    out.push('<p>' + inlineMd(buf.join('\n')).replace(/\n/g, '<br>') + '</p>');
  }

  return out.join('');
}

const I18N_RULES = [
  [/^自动选择下载源：(Gitee|GitHub)$/, 'Auto-selected source: $1'],
  [/^手动指定下载源：(Gitee|GitHub)$/, 'Source set manually: $1'],
  [/^环境变量指定下载源：(Gitee|GitHub)$/, 'Source set by environment: $1'],
  [/^网络探测失败，按系统区域选择：(Gitee|GitHub)$/, 'Probe failed; source from system region: $1'],
  [/^当前版本 (v[\d.]+)$/, 'Current version $1'],
  [/^当前已是最新版本 (v[\d.]+)$/, 'You are up to date ($1)'],
  [/^发现新版本 (v[\d.]+)，当前 (v[\d.]+)$/, 'Update available: $1 (current $2)'],
  [/^检查更新时出错：(.*)$/, 'Update check failed: $1'],
  [/^([A-Za-z]+) · 检查失败$/, '$1 · check failed'],
  [/^(\d+) 个工具调用 · 进行中$/, '$1 tool calls · running'],
  [/^(\d+) 个工具调用$/, '$1 tool calls'],
  [/^(\d+) 个步骤$/, '$1 steps'],
  [/^(\d+) 分钟前$/, '$1 min ago'],
  [/^(\d+) 小时前$/, '$1 h ago'],
  [/^(\d+) 天前$/, '$1 d ago'],
  [/^刚刚$/, 'just now'],
  [/^第 (\d+)\/(\d+) 次重试$/, 'retry $1/$2'],
  [/^循环播放：动图一直播放；点击播放：显示静帧，点一下播放一轮（约 ([\d.]+) 秒）后回到静帧。$/,
   'Loop: plays continuously. Play on click: shows a still frame and plays one cycle (~$1 s) on click.']
];

function tText(value) {
  if (state.lang !== 'en') return value;
  const key = String(value);
  if (I18N_EN[key]) return I18N_EN[key];
  for (const [re, out] of I18N_RULES) {
    if (re.test(key)) return key.replace(re, out);
  }
  return value;
}

const I18N_SKIP = '#messages, pre, code, .md, .bubble, textarea, input, script, style, noscript';

function translateDom(root) {
  if (state.lang !== 'en' || !root) return;
  const texts = [];
  if (root.nodeType === 3) {
    texts.push(root);
  } else if (root.nodeType === 1 || root.nodeType === 11 || root.nodeType === 9) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())) texts.push(node);
  }

  for (const node of texts) {
    const parent = node.parentElement;
    if (!parent || parent.closest(I18N_SKIP)) continue;
    const raw = node.nodeValue;
    const key = raw.trim();
    if (!key || !/[一-龥]/.test(key)) continue;
    const hit = tText(key);
    if (hit === key) continue;
    node.nodeValue = raw === key ? hit : raw.replace(key, hit);
  }

  const scope = root.nodeType === 1 ? root : document.body;
  if (scope && scope.querySelectorAll) {
    for (const el of scope.querySelectorAll('[title],[placeholder],[aria-label]')) {
      // 输入框的「文本内容」不能翻，但它的 placeholder / title 要翻
      if (el.closest('#messages, pre, code, script, style')) continue;
      for (const attr of ['title', 'placeholder', 'aria-label']) {
        const value = el.getAttribute(attr);
        if (!value) continue;
        const hit = tText(value);
        if (hit !== value) el.setAttribute(attr, hit);
      }
    }
  }
}

let i18nObserver = null;

function startI18n() {
  if (state.lang !== 'en') return;
  translateDom(document.body);
  if (i18nObserver) return;
  i18nObserver = new MutationObserver(mutations => {
    for (const m of mutations) {
      if (m.type === 'characterData') translateDom(m.target);
      else for (const node of m.addedNodes) translateDom(node);
    }
  });
  i18nObserver.observe(document.body, {
    childList: true,
    subtree: true,
    characterData: true,
    attributes: true,
    attributeFilter: ['title', 'placeholder', 'aria-label']
  });
}

/* 前台存活探针：SSE 保连接 + 定时心跳 + 关闭时 sendBeacon 告别 */
const ALIVE_TOKEN = Math.random().toString(36).slice(2) + Date.now().toString(36);
let aliveSource = null;
let aliveBeat = null;

function startAliveProbe() {
  if (aliveSource || aliveBeat) return;

  const beat = () => {
    fetch('/api/alive/beat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: ALIVE_TOKEN }),
      keepalive: true
    }).catch(() => { /* 服务暂时不可用，下次再试 */ });
  };

  if (typeof EventSource !== 'undefined') {
    try { aliveSource = new EventSource('/api/alive?token=' + encodeURIComponent(ALIVE_TOKEN)); }
    catch { /* 老浏览器退化为纯心跳 */ }
  }
  beat();
  aliveBeat = setInterval(beat, 5000);

  const bye = () => {
    if (navigator.sendBeacon) navigator.sendBeacon('/api/alive/bye', ALIVE_TOKEN);
  };
  window.addEventListener('pagehide', bye);
  window.addEventListener('beforeunload', bye);
}

    .filter(s => !spacePaths.has(s.cwd))
    .sort((a, b) => {

function extOf(name) {
  const parts = String(name || '').split('.');
  if (parts.length < 2) return 'file';
  return parts.pop().slice(0, 4);
}

function extractText(message) {
  if (!message) return '';
  const content = message.content;
  if (typeof content === 'string') return content;
  if (!Array.isArray(content)) return '';
  return content.filter(c => c && c.type === 'text').map(c => c.text).join('');
}

/*
 * 早期版本会把「请用 Markdown 输出」这段话拼进首条用户消息，历史记录里能看见。
 * 现在改成走系统提示词，这里只负责把旧会话里的这段剥掉。

const MD_NOTICE_HEAD = '【输出格式】本轮对话请使用 Markdown 组织回复';
const MD_NOTICE_MARK = '—— 以下为用户输入 ——';

function stripNotice(text) {
  if (typeof text !== 'string') return '';
  if (!text.trimStart().startsWith(MD_NOTICE_HEAD)) return text;
  const idx = text.indexOf(MD_NOTICE_MARK);
  if (idx === -1) return text;
  return text.slice(idx + MD_NOTICE_MARK.length).trimStart();
}

function shortLine(text, n) {
  const t = String(text || '').replace(/\s+/g, ' ').trim();
  return t.length > n ? t.slice(0, n) + '…' : t;

  body.appendChild(bubble);

  const actions = document.createElement('div');
  actions.className = 'msg-actions';
  actions.style.display = 'none';
  actions.innerHTML =
    '<button class="act" type="button" title="复制为纯文本" aria-label="复制为纯文本">&#128196;</button>' +
    '<button class="act" type="button" title="复制 Markdown 源码" aria-label="复制 Markdown 源码">&#128221;</button>';
  body.appendChild(actions);

  const noticeBox = document.createElement('div');
  noticeBox.className = 'notice';
  noticeBox.style.display = 'none';
  body.appendChild(noticeBox);

  const artBox = document.createElement('div');
  artBox.className = 'artifacts';
  artBox.style.display = 'none';
  body.appendChild(artBox);

  wrap.appendChild(body);
  msg._bubble = bubble;
  msg._actions = actions;
  msg._noticeBox = noticeBox;
  msg._toolsBox = toolsBox;
  msg._artBox = artBox;

  const actButtons = actions.querySelectorAll('.act');
  if (actButtons[0]) {
    actButtons[0].onclick = () => copyText(toPlainText(msg.text)).then(() => toast('已复制纯文本'));
  }
  if (actButtons[1]) {
    actButtons[1].onclick = () => copyText(msg.text).then(() => toast('已复制 Markdown'));
  }

  paintBubble(msg);
  paintNotice(msg);
  paintTools(msg);
  paintArtifacts(msg);
  return wrap;
}

/* ---------------------------------------------------------------- 复制 */

function copyText(text) {
  const value = String(text == null ? '' : text);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(value).catch(() => fallbackCopy(value));
  }
  return Promise.resolve(fallbackCopy(value));
}

function fallbackCopy(value) {
  const area = document.createElement('textarea');
  area.value = value;
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  try { document.execCommand('copy'); } catch { /* 老浏览器兜底失败 */ }
  document.body.removeChild(area);
}

// 把 Markdown 还原成适合粘进聊天框的纯文本
function toPlainText(markdown) {
  let text = String(markdown == null ? '' : markdown);

  text = text.replace(/```[a-zA-Z0-9_-]*\n?/g, '');
  text = text.replace(/`([^`\n]+)`/g, '$1');
  text = text.replace(/^#{1,6}\s+/gm, '');
  text = text.replace(/\*\*([^*\n]+)\*\*/g, '$1');
  text = text.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1$2');
  text = text.replace(/~~([^~\n]+)~~/g, '$1');
  text = text.replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1');
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1（$2）');

  // 表格：转成制表符分隔，丢掉分隔行
  text = text.split('\n').filter(line => !/^\s*\|[\s:|-]+\|\s*$/.test(line)).map(line => {
    if (/^\s*\|.*\|\s*$/.test(line)) {
      return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim()).join('\t');
    }
    return line;
  }).join('\n');

  text = text.replace(/^\s*[-*+]\s+/gm, '• ');
  text = text.replace(/^\s*>\s?/gm, '');
  text = text.replace(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/gm, '');
  text = text.replace(/\n{3,}/g, '\n\n');

  return text.trim();
}

function paintNotice(msg) {
  if (!msg._noticeBox) return;
  if (!msg.notice) {
    msg._noticeBox.style.display = 'none';
    msg._noticeBox.textContent = '';
    return;
  }
  msg._noticeBox.style.display = 'block';
  msg._noticeBox.className = 'notice ' + (msg.notice.kind || '');
  msg._noticeBox.textContent = msg.notice.text;
}

function paintBubble(msg) {
  if (!msg._bubble) return;

  if (msg._actions) {
    const hasText = String(msg.text || '').trim().length > 0;
    msg._actions.style.display = hasText ? 'flex' : 'none';
  }

  if (msg.role === 'user') {
    let html = escapeHtml(msg.text).replace(/\n/g, '<br>');
    if (msg.attachments && msg.attachments.length) {
      html += '<div style="margin-top:6px;font-size:11.5px;color:var(--text-3)">附件 ' +
        escapeHtml(msg.attachments.join('、')) + '</div>';
    }
    msg._bubble.innerHTML = html || '<span style="color:var(--text-3)">（空消息）</span>';
    return;
  }
  const rendered = renderMarkdown(msg.text);
  if (!rendered && !msg.streaming) {
    // 这一回合只有工具调用、没有文本输出，不显示空气泡
    msg._bubble.style.display = 'none';
  } else {
    msg._bubble.style.display = '';
    msg._bubble.innerHTML = (rendered || '<span style="color:var(--text-3)">…</span>') +
      (msg.streaming ? '<span class="cursor"></span>' : '');
  }
  if (!msg._bubble.dataset.bound) {
    msg._bubble.dataset.bound = '1';
    msg._bubble.addEventListener('click', event => {
      const copy = event.target.closest('.copy');
      if (!copy) return;
      const code = copy.closest('pre').querySelector('code');
      navigator.clipboard.writeText(code.textContent).then(() => toast('已复制'));
    });
  }
}

function paintTools(msg) {
  const box = msg._toolsBox;
  if (!box) return;
  if (!msg.tools || !msg.tools.length) {
    box.style.display = 'none';
    return;
  }

  box.style.display = 'flex';
  const open = msg._toolsOpen === true;
  box.className = 'msg-tools' + (open ? '' : ' collapsed');

  const running = msg.tools.filter(tool => tool.ms === undefined).length;
  const summary = msg.tools.length + ' 个工具调用' + (running ? ' · 进行中' : '');

  box.innerHTML =
    '<button class="tools-head" type="button">' +
    '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l4 5-4 5M13 17h6"/></svg>' +
    '<span>' + summary + '</span>' +
    '<span class="chev">&#9662;</span>' +
    '</button>' +
    '<div class="tools-body">' +
    msg.tools.map(tool =>
      '<div class="tool-row' + (tool.error ? ' err' : '') + '">' +
      '<span class="dot"></span>' +
      '<span class="name">' + escapeHtml(tool.name) + '</span>' +
      (tool.arg ? '<span class="arg">' + escapeHtml(tool.arg) + '</span>' : '') +
      (tool.ms ? '<span class="ms">' + Math.round(tool.ms) + 'ms</span>' : '') +
      '</div>'
    ).join('') +
    '</div>';

  const head = box.querySelector('.tools-head');
  if (head) {
    head.onclick = () => {
      msg._toolsOpen = !msg._toolsOpen;
      paintTools(msg);
    };
  }
}

function paintArtifacts(msg) {
  if (!msg._artBox) return;
  if (!msg.artifacts || !msg.artifacts.length) { msg._artBox.style.display = 'none'; return; }
  msg._artBox.style.display = 'flex';
  msg._artBox.innerHTML = '';
  for (const item of msg.artifacts) {
    const btn = document.createElement('button');
    btn.className = 'artifact';
    btn.title = item.path;
    btn.innerHTML =
      '<span class="ico">' + escapeHtml(extOf(item.name)) + '</span>' +
      '<span class="meta" style="display:flex;flex-direction:column;min-width:0;flex:1">' +
      '<span class="nm">' + escapeHtml(item.name) + '</span>' +
      '<span class="sz">' + escapeHtml(item.sizeText || '') + (item.source === 'scan' ? ' · 已修改' : '') + '</span>' +
      '</span><span class="go">&#8599;</span>';
    btn.onclick = () => {
      api('/api/open', { method: 'POST', body: { path: item.path } })
        .then(() => toast('已用默认程序打开'))
        .catch(err => toast(err.message));
    };
    msg._artBox.appendChild(btn);
  }
}

function scrollMessages(force) {
  const box = $('#messages');
  if (!box) return;
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  if (force || near) box.scrollTop = box.scrollHeight;
}

let streamFrame = 0;
function scheduleTurnPaint() {
  if (streamFrame) return;
  streamFrame = requestAnimationFrame(() => {
    streamFrame = 0;
    paintTurn();
  });
}

/*
 * 一次提问里 Pi 会跑多轮：每轮一条 assistant 消息，中间夹着工具调用。
 * 这些都属于同一个回合，全部收进一个气泡，用空行分段。
 */
function currentTurnMessage() {
  if (state.turn.msg) return state.turn.msg;
  const msg = { role: 'ai', text: '', tools: [], artifacts: [], streaming: true, notice: null };
  state.turn.msg = msg;
  state.messages.push(msg);
  $('#messages').appendChild(buildMessageNode(msg));
  scrollMessages(true);
  return msg;
}

function composeTurnText() {
  const parts = state.turn.parts.slice();
  const segment = state.turn.segment.trim();
  if (segment) parts.push(segment);
  return parts.filter(Boolean).join('\n\n');
}

function paintTurn() {
  const msg = state.turn.msg;
  if (!msg) return;
  msg.text = composeTurnText();
  paintBubble(msg);
  scrollMessages(false);
}

function resetTurn() {
  state.turn = { msg: null, parts: [], segment: '' };
}

function renderMessages() {
  const box = $('#messages');
  box.innerHTML = '';
  for (const msg of state.messages) box.appendChild(buildMessageNode(msg));
  scrollMessages(true);
}

function currentTitle() {
  if (state.session && state.session.name) return state.session.name;
  const firstUser = state.messages.find(m => m.role === 'user' && m.text);
  if (firstUser) return shortLine(firstUser.text, 30);
  return '新任务';
}

function renderChatHead() {
  $('#chatTitle').textContent = currentTitle();

// 首页标志：用户导入的图片或动图（文件存在 data/，由 /logo 路由提供）
let logoPoster = { key: null, url: null };
let logoPlayTimer = null;

function renderHomeLogo() {
  const box = $('#homeLogo');
  const img = $('#homeLogoImg');
  if (!box || !img) return;
  const logo = currentApp().logo;

  if (logoPlayTimer) { clearTimeout(logoPlayTimer); logoPlayTimer = null; }
  box.classList.remove('playing');
  if (!logo || !logo.file) {
    img.removeAttribute('src');
    img.removeAttribute('title');
    box.classList.remove('clickable');
    box.classList.add('hidden');
    box.onclick = null;
    return;
  }

  const key = String(logo.mtime || logo.file);
  const src = '/logo?v=' + encodeURIComponent(key);
  img.alt = logo.name || '';
  box.classList.remove('hidden');

  const clickMode = !!(logo.animated && logo.playMode === 'click');
  box.classList.toggle('clickable', clickMode);
  img.title = clickMode ? '点击播放标志' : '';
  if (!clickMode) {
    img.src = src;
    box.onclick = null;
    layoutHomeLogo();
    return;
  }

  // 点击播放：用 canvas 抓首帧做静帧海报，点击后换成动图播一轮再还原
  const showPoster = () => { img.src = logoPoster.url || src; };
  if (logoPoster.key === key && logoPoster.url) {
    showPoster();
  } else {
    showPoster();
    const probe = new Image();
    probe.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = probe.naturalWidth;
        c.height = probe.naturalHeight;
        c.getContext('2d').drawImage(probe, 0, 0);
        logoPoster = { key, url: c.toDataURL('image/png') };
        if (!box.classList.contains('playing')) showPoster();
      } catch { /* 画不出来就保持动图 */ }
    };
    probe.src = '/logo?poster=' + encodeURIComponent(key);
  }

  box.onclick = () => {
    if (logoPlayTimer) { clearTimeout(logoPlayTimer); logoPlayTimer = null; }
    img.src = '/logo?play=' + Date.now();       // 换 URL 才会从第一帧重新播
    box.classList.add('playing');
    const dur = Math.max(300, Math.min(60000, Number(logo.durationMs) || 3000));
    logoPlayTimer = setTimeout(() => {
      logoPlayTimer = null;
      box.classList.remove('playing');
      if (logoPoster.url) showPoster();
      else renderHomeLogo();
    }, dur);
  };
  layoutHomeLogo();
}


// logo 尺寸：底边压在输入框垂直中线上，右上角贴页面右上角，正方形等比例缩放
function layoutHomeLogo() {
  const logo = $('#homeLogo');
  const main = document.querySelector('.main');
  const input = $('#composer');
  if (!logo || !main || !input) return;
  if (logo.classList.contains('hidden')) return;

  const mainRect = main.getBoundingClientRect();
  const inputRect = input.getBoundingClientRect();
  if (!inputRect.width) return;

  // 只取输入框右侧中点的 y 坐标：页面顶 → 输入框垂直中线，就是正方形边长
  const spanY = (inputRect.top + inputRect.height / 2) - mainRect.top;
  // 兜底：边长不超过主区宽度，避免极窄窗口下越出左侧
  const side = Math.round(Math.min(spanY, mainRect.width));
  if (side < 48) { logo.style.display = 'none'; return; }
  logo.style.display = '';
  logo.style.width = side + 'px';
  logo.style.height = side + 'px';
}

function switchView(view) {
  state.view = view;
  $('#welcome').classList.toggle('hidden', view !== 'welcome');
  $('#chat').classList.toggle('hidden', view !== 'chat');
  $('#panel').classList.toggle('hidden', view !== 'panel');

  // 欢迎态整体居中，让输入框落在页面中部
  const mainEl = document.querySelector('.main');
  if (mainEl) mainEl.classList.toggle('welcome-mode', view === 'welcome');

  // 首页标志：只在欢迎页显示，且必须已导入图片
  const homeLogo = $('#homeLogo');
  const hasLogo = !!(currentApp().logo && currentApp().logo.file);
  if (homeLogo) homeLogo.classList.toggle('hidden', view !== 'welcome' || !hasLogo);
  requestAnimationFrame(layoutHomeLogo);

  const hideComposer = view === 'panel';
  $('#composerWrap').classList.toggle('hidden', hideComposer);
  $$('#nav .nav-item').forEach(item => {
    const key = view === 'panel' && item.dataset.view === 'more' ? null : item.dataset.view;
    const active = (view === 'panel' && item.dataset.panelKey === state.panel) ||
      (view !== 'panel' && item.dataset.view === view);
    item.classList.toggle('active', !!active && (key !== null || view === 'panel'));
  });
  if (view === 'welcome') renderPresets();
  if (view === 'chat') scrollMessages(true);
}

      '<button class="btn primary" data-use-preset="' + p.key + '">用这个场景</button>' +
      '</div></div></div>'
    ).join('');
    content += '<div class="card"><div class="card-row"><div class="grow">' +
      '<div class="card-title">自定义专家</div><div class="card-sub">把模式、技能、连接器和提示词存成一组，下次一键复用</div>' +
      '</div><div class="card-actions"><button class="btn" disabled>后续版本</button></div></div></div>';
  }

  if (state.hubTab === 'skills') {
    content += '<div class="note" style="margin-bottom:14px">这里的开关只影响 <strong>Pi-buddy 启动的新会话</strong>：关掉的技能不会出现在 <code>+</code> 菜单里，也不会被自动加载。Pi 全局配置和终端里的 <code>pi</code> 不受影响。</div>';
    if (!skills.length) {
      content += '<div class="card"><div class="card-title">还没有发现技能</div>' +
        '<div class="card-sub">把技能目录放到 <code>' + escapeHtml((state.boot && state.boot.home) || '~') +
        '\\.pi\\agent\\skills\\&lt;技能名&gt;\\SKILL.md</code>，或在项目里建 <code>.pi/skills</code> 后刷新。</div></div>';
    } else {
      content += skills.map(s => {
        const off = disabledSkills.has(s.id);
        return '<div class="card"><div class="card-row"><div class="grow">' +
          '<div class="card-title">' + escapeHtml(s.name) + '</div>' +
          '<div class="card-sub">' + escapeHtml(s.description || s.path) + '</div>' +
          '<div class="card-sub" style="font-family:var(--mono);font-size:11px;margin-top:3px">' +

function renderCron() {
  const app = currentApp();
  const tasks = app.cron || [];
  const list = tasks.length ? tasks.map(t => {
    const schedule = t.schedule || {};
    let when = '';
    if (schedule.kind === 'interval') when = '每 ' + (schedule.minutes || 30) + ' 分钟';
    else if (schedule.kind === 'weekly') when = '每周 ' + (schedule.days || []).join('、') + ' ' + (schedule.time || '09:00');
    else when = '每天 ' + (schedule.time || '09:00');
    const status = t.lastStatus === 'ok' ? '上次成功' : t.lastStatus === 'error' ? '上次失败' : t.lastStatus === 'timeout' ? '上次超时' : '未运行';
    return '<div class="card"><div class="card-row"><div class="grow">' +
      '<div class="card-title">' + escapeHtml(t.name) + '</div>' +
      '<div class="card-sub">' + escapeHtml(when) + ' · ' + escapeHtml(t.cwd || '') + '</div>' +
      '<div class="card-sub">' + escapeHtml(status) + (t.lastRun ? ' · ' + relTime(t.lastRun) : '') +
      (t.lastOutput ? ' · ' + escapeHtml(t.lastOutput.slice(0, 90)) : '') + '</div>' +
      '</div><div class="card-actions">' +
      '<button class="btn sm" data-cron-run="' + escapeHtml(t.id) + '">立即运行</button>' +

function safeUpdateUrl(url) {
  return /^https:\/\//i.test(String(url || '')) ? url : '';
}

function renderUpdateResult(data) {
  const box = $('#updateResult');
  if (!box) return;
  const esc = escapeHtml;
  const sources = (data && data.sources) || [];
  const good = sources.filter(s => s.ok);
  let html = '';
  if (!data || data.ok === false) {
    html += '<div class="note">检查更新时出错：' + esc((data && data.error) || '未知错误') + '</div>';
  } else if (!good.length) {
    html += '<div class="note">无法连接更新服务器，请检查网络后重试</div>';
  } else if (data.upToDate === true) {
    html += '<div class="note">当前已是最新版本 v' + esc(data.current) + '</div>';
  } else if (data.upToDate === false) {
    html += '<div class="note">发现新版本 v' + esc(data.latest) +
      '，当前 v' + esc(data.current) + '</div>';
  } else {
    html += '<div class="note">暂无可用版本信息</div>';
  }
  if (good.some(s => !s.modern)) {
    html += '<div class="note" style="margin-top:6px">远端标签仍使用旧版本号规则，建议按新规则重新打标签</div>';
  }
  const region = data && data.region;
  const primaryLabel = (data && data.primaryLabel) || (region === 'cn' ? 'Gitee' : 'GitHub');
  const regionSource = (data && data.regionSource) || 'system';
  if (region) {
    const note = regionSource === 'auto'
      ? '自动选择下载源：' + primaryLabel
      : regionSource === 'manual'
        ? '手动指定下载源：' + primaryLabel
        : regionSource === 'env'
          ? '环境变量指定下载源：' + primaryLabel
          : '网络探测失败，按系统区域选择：' + primaryLabel;
    html += '<div class="card-sub" style="margin-top:8px">' + esc(note) + '</div>';
  }

  if (data && data.fallbackUsed) {
    html += '<div class="note" style="margin-top:6px">主下载源暂时不可用，已切换到备用源</div>';
  }
  const upToDate = data && data.upToDate;
  for (const s of sources) {
    const page = safeUpdateUrl(s.page) || safeUpdateUrl(s.releases);
    const download = safeUpdateUrl(s.download) || page;
    const label = s.ok ? esc(s.tag) : '检查失败';
    const badge = s.primary
      ? '<span class="pill on" style="margin-right:6px">推荐</span>'
      : '<span class="pill" style="margin-right:6px">备用</span>';
    html += '<div class="row-line" style="margin-top:6px"><span class="grow" style="font-size:12.5px">' +
      badge + esc(s.label) + ' · ' + label + '</span>' +
      (upToDate === false && s.ok && download
        ? '<a class="btn sm' + (s.primary ? ' primary' : '') + '" href="' + esc(download) +
          '" target="_blank" rel="noopener">下载新版</a> '
        : '') +
      (page ? '<a class="btn sm" href="' + esc(page) + '" target="_blank" rel="noopener">打开发布页</a>' : '') +
      '</div>';
  }

  box.innerHTML = html;
}
function bindPanel() {
  const box = $('#panel');

  $$('[data-tab]', box).forEach(tab => {
    tab.onclick = () => { state.hubTab = tab.dataset.tab; renderPanel(); };
  });

  $$('[data-use-preset]', box).forEach(btn => {
    btn.onclick = () => {
      state.preset = btn.dataset.usePreset;
      state.panel = 'hub';
      switchView('welcome');
      renderPresets();
      $('#input').focus();
      toast('已选择「' + state.boot.presets[btn.dataset.usePreset].label + '」场景');
    };
  });

  $$('[data-skill]', box).forEach(input => {
    input.onchange = async () => {
      const app = currentApp();
      const disabled = new Set((app.skills && app.skills.disabled) || []);
      if (input.checked) disabled.delete(input.dataset.skill);
      else disabled.add(input.dataset.skill);
      await saveSettings({ skills: { disabled: Array.from(disabled) } });
      renderPanel();
    };
  });

  $$('[data-mcp]', box).forEach(input => {
    input.onchange = async () => {
      const app = currentApp();
      const disabled = new Set((app.mcp && app.mcp.disabled) || []);
      if (input.checked) disabled.delete(input.dataset.mcp);
      else disabled.add(input.dataset.mcp);
      await saveSettings({ mcp: { disabled: Array.from(disabled) } });
      renderPanel();
    };
  });

  $$('[data-sidebar]', box).forEach(input => {
    input.onchange = async () => {
      const sidebar = Object.assign({}, (currentApp().ui || {}).sidebar || {});
      sidebar[input.dataset.sidebar] = input.checked;
      await saveSettings({ ui: { sidebar } });
      applySidebarVisibility();
      renderPanel();
    };
  });

  const mdSwitch = $('#setMarkdown');
  if (mdSwitch) {
    mdSwitch.onchange = async () => {
      state.markdown = mdSwitch.checked;
      await saveSettings({ ui: { markdown: state.markdown } });
      renderPanel();
      if (state.view === 'chat') renderChatHead();
      toast(state.markdown ? 'Markdown 输出已开启（新会话生效）' : 'Markdown 输出已关闭（新会话生效）');
    };
  }

  const retrySave = $('#retrySave');
  if (retrySave) {
    retrySave.onclick = async () => {
      try {
        const data = await api('/api/retry', {
          method: 'POST',
          body: {
            enabled: $('#retryEnabled').checked,
            maxRetries: Number($('#retryMax').value),
            baseDelayMs: Number($('#retryBase').value),
            maxAgentDelayMs: Number($('#retryMaxDelay').value)
          }
        });
        state.retry = data.retry;
        if (state.boot) state.boot.retry = data.retry;
        renderPanel();
        toast('重试设置已保存，新会话生效');
      } catch (err) {
        toast('保存失败: ' + err.message);
      }
    };
  }

  const cronAdd = $('#cronAdd');
  if (cronAdd) {
    cronAdd.onclick = async () => {
      const name = $('#cronName').value.trim();
      const prompt = $('#cronPrompt').value.trim();
      if (!name || !prompt) { toast('名称和提示词都要填'); return; }
      const kind = $('#cronKind').value;
      const schedule = kind === 'interval'
        ? { kind: 'interval', minutes: Number($('#cronMinutes').value) || 60 }
        : kind === 'weekly'
          ? { kind: 'weekly', days: [1, 2, 3, 4, 5], time: $('#cronTime').value || '09:00' }
          : { kind: 'daily', time: $('#cronTime').value || '09:00' };
      try {
        await api('/api/cron', { method: 'POST', body: {
          name, prompt, schedule,
          cwd: $('#cronCwd').value.trim(),
          model: state.model ? state.model.id : ''
        } });
        const data = await api('/api/cron');
        currentApp().cron = data.tasks;
        renderPanel();
        toast('任务已添加');
      } catch (err) { toast(err.message); }
    };
  }

  $$('[data-cron-run]', box).forEach(btn => {
    btn.onclick = () => {
      api('/api/cron/run', { method: 'POST', body: { id: btn.dataset.cronRun } })
        .then(() => toast('已触发，稍后刷新看状态'))
        .catch(err => toast(err.message));
    };
  });

  $$('[data-cron-del]', box).forEach(btn => {
    btn.onclick = async () => {
      try {
        const data = await api('/api/cron', { method: 'POST', body: { remove: btn.dataset.cronDel } });
        currentApp().cron = data.tasks;
        renderPanel();
      } catch (err) { toast(err.message); }
    };
  });

  const libAdd = $('#libAdd');
  if (libAdd) {
    libAdd.onclick = async () => {
      const target = await pickFolder(state.folder || (state.boot && state.boot.home) || '');
      if (!target) return;
      const app = currentApp();
      const spaces = (app.spaces || []).slice();
      if (!spaces.some(s => s.path === target)) {
        spaces.push({ name: target.split(/[\\/]/).filter(Boolean).pop() || target, path: target });
      }
      await saveSettings({ spaces });
      renderSidebar();
      await loadLibrary();
      renderPanel();
      toast('已挂载 ' + target);
    };
  }

  $$('[data-space-del]', box).forEach(btn => {
    btn.onclick = async () => {
      const app = currentApp();
      app.spaces = (app.spaces || []).filter(s => s.path !== btn.dataset.spaceDel);
      await saveSettings({ spaces: app.spaces });
      renderSidebar();
      await loadLibrary();
      renderPanel();
    };
  });

  $$('[data-open-file]', box).forEach(btn => {
    btn.onclick = () => api('/api/open', { method: 'POST', body: { path: btn.dataset.openFile } })
      .then(() => toast('已用默认程序打开'))
      .catch(err => toast(err.message));
  });

  const notifySelect = $('#notifyMode');
  if (notifySelect) {
    notifySelect.onchange = async () => {
      await saveSettings({ notify: { mode: notifySelect.value } });
      if (state.boot) state.boot.app.notify = { mode: notifySelect.value };
      toast('提醒方式已保存');
    };
  }

  const notifyPerm = $('#notifyPerm');
  if (notifyPerm) {
    const permState = $('#notifyPermState');
    const refreshPerm = () => {
      if (typeof Notification === 'undefined') { permState.textContent = '当前浏览器不支持'; return; }
      permState.textContent = Notification.permission === 'granted' ? '已授权'
        : Notification.permission === 'denied' ? '已被拒绝，需在浏览器设置里恢复' : '尚未授权';
    };
    refreshPerm();
    notifyPerm.onclick = async () => {
      if (typeof Notification === 'undefined') { toast('当前浏览器不支持通知'); return; }
      try {
        const permission = await Notification.requestPermission();
        refreshPerm();
        if (permission !== 'granted') { toast('未获得通知权限'); return; }

        // 授权成功后顺手切成双通道，否则「系统通知」模式下浏览器通道根本不会走
        const mode = ((currentApp().notify) || {}).mode;
        if (mode === 'system' || mode === 'off') {
          await saveSettings({ notify: { mode: 'both' } });
          if (state.boot) state.boot.app.notify = { mode: 'both' };
          renderPanel();
          toast('已授权，提醒方式已改为「两者都开」');
        } else {
          toast('浏览器通知已开启');
        }
      } catch (err) {
        toast('授权失败: ' + err.message);
      }
    };
  }

  const notifyTest = $('#notifyTest');
  if (notifyTest) {
    notifyTest.onclick = async () => {
      const box = $('#notifyTestResult');
      box.style.color = 'var(--text-3)';
      box.textContent = '发送中…';
      const result = await notifyTaskDone('Pi-buddy 测试通知', '看到这条，说明任务提醒能正常工作');

      const parts = [];
      if (result.skipped) parts.push('当前设置为关闭');
      if (result.browser !== 'skipped') parts.push('浏览器：' + result.browser);
      if (result.system !== 'skipped') parts.push('系统：' + result.system);

      const browserOk = typeof result.browser === 'string' && result.browser.indexOf('ok') === 0;
      const delivered = browserOk || result.system === 'ok';

      const diag = '权限=' + (typeof Notification === 'undefined' ? '不支持' : Notification.permission) +
        ' · 安全上下文=' + (window.isSecureContext ? '是' : '否') +
        ' · SW=' + (typeof navigator !== 'undefined' && 'serviceWorker' in navigator ? '支持' : '不支持');

      box.style.color = delivered ? 'var(--accent)' : 'var(--danger)';
      box.textContent = (parts.join(' · ') || '没有可用的提醒方式') + '　' + diag;
    };
  }

  const logoPick = $('#logoPick');
  const logoFile = $('#logoFile');
  if (logoPick && logoFile) {
    logoPick.onclick = () => logoFile.click();
    logoFile.onchange = async () => {
      const file = logoFile.files && logoFile.files[0];
      if (!file) return;
      const box = $('#logoState');
      if (box) { box.style.color = 'var(--text-3)'; box.textContent = '正在上传…'; }
      try {
        const data = await api('/api/logo', {
          method: 'POST',
          headers: { 'x-filename': encodeURIComponent(file.name) },
          body: file
        });
        state.boot.app.logo = data.logo;
        renderHomeLogo();
        renderPanel();
        toast('首页标志已更新');
      } catch (err) {
        if (box) { box.style.color = 'var(--danger)'; box.textContent = '上传失败：' + err.message; }
        else toast('上传失败: ' + err.message);
      }
    };
  }

  const logoRemove = $('#logoRemove');
  if (logoRemove) {
    logoRemove.onclick = async () => {
      try {
        await api('/api/logo', { method: 'DELETE' });
        state.boot.app.logo = null;
        renderHomeLogo();
        renderPanel();
        toast('已移除首页标志');
      } catch (err) {
        toast('移除失败: ' + err.message);
      }
    };
  }

  const logoMode = $('#logoPlayMode');
  if (logoMode) {
    logoMode.onchange = async () => {
      const mode = logoMode.value;
      state.boot.app.logo.playMode = mode;
      await saveSettings({ logo: { playMode: mode } });
      renderHomeLogo();
      renderPanel();
    };
  }

  const setUpdateSource = $('#setUpdateSource');
  if (setUpdateSource) {
    setUpdateSource.onchange = async () => {
      const value = setUpdateSource.value;
      try {
        const data = await api('/api/settings', { method: 'POST', body: { ui: { updateSource: value } } });
        state.boot.app = data.app;
        updateResult = null;
        const btn = $('#btnCheckUpdate');
        if (btn) btn.click();
        toast('下载源已保存');
      } catch (err) { toast('保存失败: ' + err.message); }
    };
  }
  const btnUpdate = $('#btnCheckUpdate');
  if (btnUpdate) {
    btnUpdate.onclick = async () => {
      const status = $('#updateStatus');
      const box = $('#updateResult');
      btnUpdate.disabled = true;
      if (status) status.textContent = '检查中…';
      if (box) box.innerHTML = '';
      try {
        updateResult = await api('/api/update/check?force=1');
        if (status) status.textContent = '检查完成';
      } catch (err) {
        updateResult = { ok: false, error: err.message, sources: [] };
        if (status) status.textContent = '检查失败';
      }
      renderUpdateResult(updateResult);
      btnUpdate.disabled = false;
    };
  }
  if (updateResult) {
    renderUpdateResult(updateResult);
    const status = $('#updateStatus');
    if (status && updateResult.ok !== false) status.textContent = '检查完成';
  }
  const btnQuit = $('#btnQuit');
  if (btnQuit) {
    btnQuit.onclick = async () => {
      if (!window.confirm('退出后需要重新启动 Pi-buddy，确定吗？')) return;
      try { await api('/api/quit', { method: 'POST' }); } catch { /* 连接被切断属正常 */ }
      toast('服务已退出，可以关闭这个页面了');
    };
  }

  const search = $('#libSearch');
  if (search) {
    search.oninput = () => {
      state.libQuery = search.value;
      const listBox = search.parentElement.querySelector('.card[style*="padding:6px"]');
      if (!listBox) return;
      const q = state.libQuery.trim().toLowerCase();
      const items = (state.libItems || []).filter(item =>
        !q || item.name.toLowerCase().includes(q) || item.path.toLowerCase().includes(q));
      listBox.innerHTML = items.length ? items.slice(0, 200).map(item =>
        '<div class="file-item"><span class="ico">' + escapeHtml(extOf(item.name)) + '</span>' +
        '<span class="nm" title="' + escapeHtml(item.path) + '">' + escapeHtml(item.name) + '</span>' +
        '<span class="meta">' + escapeHtml(item.sizeText || '') + '</span>' +
        '<button class="btn sm" data-open-file="' + escapeHtml(item.path) + '">打开</button></div>'
      ).join('') : '<div class="card-sub" style="padding:10px 0">没有匹配的文件</div>';
      $$('[data-open-file]', listBox).forEach(btn => {
        btn.onclick = () => api('/api/open', { method: 'POST', body: { path: btn.dataset.openFile } })
          .then(() => toast('已用默认程序打开')).catch(err => toast(err.message));
      });
    };
  }
}

/* ---------------------------------------------------------------- 弹层 */

function closePopover() {
  if (state.popover && state.popover.parentNode) state.popover.parentNode.removeChild(state.popover);
  state.popover = null;
}

function showPopover(anchor, html, options) {
  closePopover();
  const opts = options || {};
  const pop = document.createElement('div');
  pop.className = 'pop' + (opts.cls ? ' ' + opts.cls : '');
  pop.innerHTML = html;
  document.body.appendChild(pop);

  const size = pop.getBoundingClientRect();
  let left;
  let top;

  if (opts.at) {
    left = opts.at.x;
    top = opts.at.y;
  } else {
    const rect = anchor.getBoundingClientRect();
    left = rect.left;
    top = opts.below ? rect.bottom + 8 : rect.top - size.height - 8;
  }

  if (left + size.width > window.innerWidth - 10) left = window.innerWidth - size.width - 10;
  if (left < 10) left = 10;
  if (top + size.height > window.innerHeight - 10) top = window.innerHeight - size.height - 10;
  if (top < 10) top = 10;

  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  state.popover = pop;
  return pop;
}

function showTaskMenu(anchor, item, point) {
  if (!item) return;
  const pinned = ((currentApp().pinned) || []).includes(item.path);

  const html =
    '<button class="pop-item" data-pin="1"><span>' + (pinned ? '取消置顶' : '置顶') + '</span></button>' +
    '<div class="pop-sep"></div>' +
    '<button class="pop-item danger" data-del="1">' +
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M4 7h16M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M6.5 7l.9 12.4A1.6 1.6 0 0 0 9 21h6a1.6 1.6 0 0 0 1.6-1.6L17.5 7"/>' +
    '</svg><span>删除对话</span></button>';

  const pop = showPopover(anchor, html, { at: point });

  const pinBtn = $('[data-pin]', pop);
  if (pinBtn) {
    pinBtn.onclick = async () => {
      closePopover();
      try {
        const data = await api('/api/sessions/pin', { method: 'POST', body: { path: item.path, pinned: !pinned } });
        if (state.boot) state.boot.app.pinned = data.pinned;
        renderSidebar();
        toast(pinned ? '已取消置顶' : '已置顶');
      } catch (err) {
        toast(err.message);
      }
    };
  }

  const delBtn = $('[data-del]', pop);
  if (delBtn) {
    delBtn.onclick = async () => {
      closePopover();
      const ok = await confirmDelete('删除这条对话？', '会话文件和其中的聊天记录会被永久删除，无法恢复。');
      if (!ok) return;
      try {
        await api('/api/sessions/delete', { method: 'POST', body: { path: item.path } });
        if (state.session && state.session.sessionPath === item.path) newTask();
        await refreshSessions();
        toast('已删除');
      } catch (err) {
        toast(err.message);
      }
    };
  }
}

function confirmDelete(title, text) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:95;background:rgba(24,24,22,.32);display:grid;place-items:center';

    const box = document.createElement('div');
    box.style.cssText = 'width:min(420px,90vw);background:#fff;border:1px solid var(--border-strong);border-radius:14px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.22)';
    box.innerHTML =
      '<div style="font-size:15px;font-weight:500;margin-bottom:6px">' + escapeHtml(title) + '</div>' +
      '<div style="font-size:13px;color:var(--text-2);line-height:1.65;margin-bottom:16px">' + escapeHtml(text) + '</div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end">' +
      '<button class="btn" data-no="1">取消</button>' +
      '<button class="btn danger" data-yes="1">删除</button></div>';

    overlay.appendChild(box);
    document.body.appendChild(overlay);

    const finish = value => {
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      resolve(value);
    };
    $('[data-no]', box).onclick = () => finish(false);
    $('[data-yes]', box).onclick = () => finish(true);
    overlay.addEventListener('mousedown', event => { if (event.target === overlay) finish(false); });
  });
}

document.addEventListener('mousedown', event => {
  if (!state.popover) return;
  if (state.popover.contains(event.target)) return;
  if (event.target.closest('#btnPlus, #btnModel, #btnMore, #btnAddSpace')) return;
  closePopover();
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') closePopover();
});

    html += skills.length
      ? skills.map(s => '<button class="pop-item' + (state.skill && state.skill.id === s.id ? ' active' : '') +
        '" data-pick-skill="' + escapeHtml(s.id) + '"><span>' + escapeHtml(s.name) +
        '</span><span class="sub">' + escapeHtml(s.scope) + '</span></button>').join('')
      : '<div class="empty-tip">没有可用技能。把 SKILL.md 放到 ~/.pi/agent/skills 下。</div>';
  } else if (level === 'mcp') {
