      : '<div class="empty-tip">没有检测到 MCP 配置。</div>';
  } else if (level === 'mode') {
    back = true;
    const rows = [
      ['', 'Agent 模式', '默认，可读写文件'],
      ['plan', 'Plan 模式', '只读工具，先出计划'],
      ['ask', '仅问答', '禁用全部工具']
    ];
    html = '<div class="pop-title">选择对话模式</div>' + rows.map(([key, label, sub]) =>
      '<button class="pop-item' + ((state.mode || '') === key ? ' active' : '') + '" data-pick-mode="' + key + '">' +
      '<span>' + label + '</span><span class="sub">' + sub + '</span></button>').join('');
  } else {
    html = '<button class="pop-item" data-act="file"><span>添加文件</span><span class="sub">任意格式</span></button>' +
      '<button class="pop-item" data-act="image"><span>添加图片</span><span class="sub">可多选</span></button>' +
      '<div class="pop-sep"></div>' +
      '<button class="pop-item" data-sub="skill"><span>技能</span><span class="arrow">&#9656;</span></button>' +
      '<button class="pop-item" data-sub="mcp"><span>连接器</span><span class="arrow">&#9656;</span></button>' +
      '<button class="pop-item" data-sub="mode"><span>模式</span><span class="arrow">&#9656;</span></button>';
  }

  if (back) {
    html = '<button class="pop-item" data-back="1"><span>&#9666; 返回</span></button><div class="pop-sep"></div>' + html;
  }

  const pop = showPopover(anchor, html, { below: false });

  $$('[data-act]', pop).forEach(btn => {
    btn.onclick = () => {
      closePopover();
      const picker = $('#filePicker');
      picker.accept = btn.dataset.act === 'image' ? 'image/*' : '';
      picker.dataset.mode = btn.dataset.act;
      picker.click();
    };
  });

  $$('[data-sub]', pop).forEach(btn => {
    btn.onclick = () => showPlusMenu(btn.dataset.sub);
  });

  const backBtn = $('[data-back]', pop);
  if (backBtn) backBtn.onclick = () => showPlusMenu('root');

  $$('[data-pick-skill]', pop).forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.pickSkill;
      state.skill = id ? (state.boot.skills || []).find(s => s.id === id) || null : null;
      renderChips();
      closePopover();
    };

  $$('[data-pick-mcp]', pop).forEach(btn => {

      if (name === '__none__') state.mcp = { name: '__none__', mode: 'none' };

      else state.mcp = (state.boot.mcp || []).find(m => m.name === name) || null;

  $$('[data-pick-mode]', pop).forEach(btn => {

      closePopover();

}

function showModelMenu() {
  const models = (state.boot && state.boot.models) || [];
  const listHtml = models.length
    ? '<div class="pop-title">' + (state.sessionId ? '切换当前会话模型' : '新会话使用的模型') + '</div>' +
      models.map(m => '<button class="pop-item' + (state.model && state.model.id === m.id && state.model.provider === m.provider ? ' active' : '') +
        '" data-model="' + escapeHtml(m.provider + '|' + m.id) + '"><span>' + escapeHtml(m.name) +
        '</span><span class="sub">' + escapeHtml(m.providerName) + '</span></button>').join('')
    : '<div class="empty-tip">没有读到模型配置。<br />检查 ~/.pi/agent/models.json。</div>';

  const html = listHtml +
    '<div class="pop-sep"></div>' +
    '<button class="pop-item" data-add-model="1"><span>+ 添加新模型</span></button>';

  const pop = showPopover($('#btnModel'), html, { below: false });

  $$('[data-model]', pop).forEach(btn => {
    btn.onclick = async () => {
      const [provider, ...rest] = btn.dataset.model.split('|');
      const id = rest.join('|');
      const model = models.find(m => m.provider === provider && m.id === id);
      closePopover();
      if (!model) return;

      if (state.sessionId) {
        try {
          await api('/api/session/' + state.sessionId + '/model', { method: 'POST', body: { provider, modelId: id } });
          state.model = model;
          renderModelButton();
          renderChatHead();
          toast('已切换到 ' + model.name);
        } catch (err) { toast('切换失败: ' + err.message); }
      } else {
        state.model = model;
        renderModelButton();
        toast('新会话将使用 ' + model.name);
      }
    };
  });

  const addBtn = $('[data-add-model]', pop);
  if (addBtn) {
    addBtn.onclick = () => {
      closePopover();
      openAddModelDialog();
    };
  }
}

/* ---------------------------------------------------------------- 会话 */

function connectSse() {
  if (state.es) { try { state.es.close(); } catch { /* 已关闭 */ } }
  return new Promise(resolve => {
    let settled = false;
    const done = () => { if (!settled) { settled = true; resolve(true); } };

    let es;
    try {
      es = new EventSource('/api/session/' + state.sessionId + '/events');
    } catch {
      done();
      return;
    }
    state.es = es;

    es.onopen = done;
    es.onmessage = event => {
      let payload;
      try { payload = JSON.parse(event.data); } catch { return; }
      handleEvent(payload);
    };
    es.onerror = () => {
      if (es.readyState === EventSource.CLOSED) done();
    };
    setTimeout(done, 6000);
  });
}

async function ensureSession() {
  const preset = state.preset && state.boot.presets[state.preset];
  const app = currentApp();
  const disabledMcp = (app.mcp && app.mcp.disabled) || [];

  let mcpMode = 'all';
  let mcpExclude = [];
  if (state.mcp) {
    if (state.mcp.mode === 'none') {
      mcpMode = 'none';
    } else {
      mcpMode = 'only';
      mcpExclude = disabledMcp.map(name => 'mcp__' + name + '__*');
      mcpExclude.push('mcp__' + state.mcp.name + '__*');
    }
  } else if (disabledMcp.length) {
    mcpMode = 'only';
    mcpExclude = disabledMcp.map(name => 'mcp__' + name + '__*');
  }

  const payload = {
    cwd: state.folder || undefined,
    model: state.model ? state.model.id : undefined,
    provider: state.model ? state.model.provider : undefined,
    mode: state.mode || (preset ? preset.mode : 'agent'),
    skillPath: state.skill ? state.skill.path : undefined,
    mcpMode,
    mcpExclude,
    fullAccess: state.fullAccess,
    markdown: state.markdown,
    systemPrompt: preset ? preset.systemPrompt : undefined,
    preset: state.preset || ''
  };

  const data = await api('/api/session', { method: 'POST', body: payload });
  state.sessionId = data.session.id;
  state.session = data.session;
  await connectSse();
  switchView('chat');
  renderMessages();
  renderChatHead();
}

/* ---------------------------------------------------------------- 任务完成提醒 */

let swReady = null;
function ensureServiceWorker() {
  if (typeof navigator === 'undefined' || !('serviceWorker' in navigator)) return Promise.resolve(null);
  if (!swReady) {
    swReady = navigator.serviceWorker.register('/sw.js')
      .then(() => navigator.serviceWorker.ready)
      .catch(() => null);
  }
  return swReady;
}

/*
 * 浏览器通知优先走 Service Worker 的 showNotification。
 * 直接用 new Notification() 在 Chromium 内核里，页面有焦点时经常被静默。
 */
async function showBrowserNotification(title, body) {
  const registration = await ensureServiceWorker();
  if (registration) {
    try {
      await registration.showNotification(title, {
        body: body,
        tag: 'pibuddy-done',
        renotify: true,
        requireInteraction: true
      });
      return 'ok';
    } catch { /* 落到下面的直接构造 */ }
  }

  try {
    new Notification(title, { body: body, requireInteraction: true });
    return 'ok（直接构造）';
  } catch (err) {
    return '失败：' + err.message;
  }
}

async function notifyTaskDone(title, body) {
  const mode = ((currentApp().notify) || {}).mode || 'off';
  if (mode === 'off' || !body) return { skipped: true };

  const result = { browser: 'skipped', system: 'skipped' };

  if (mode === 'browser' || mode === 'both') {
    if (typeof Notification === 'undefined') {
      result.browser = '浏览器不支持通知';
    } else if (Notification.permission !== 'granted') {
      result.browser = '未授权（当前 ' + Notification.permission + '）';
    } else {
      result.browser = await showBrowserNotification(title, body);
    }
  }

  if (mode === 'system' || mode === 'both') {
    try {
      await api('/api/notify', { method: 'POST', body: { title, body } });
      result.system = 'ok';
    } catch (err) {
      result.system = '失败：' + err.message;
    }
  }

  return result;
}

/* ---------------------------------------------------------------- 事件流 */

function handleEvent(event) {
  switch (event.type) {
    case 'start': {
      state.streaming = true;
      // 重试时后端会换新会话重发，沿用同一个气泡，不要新开
      if (!state.retrying) resetTurn();
      updateSendBtn();
      renderChatHead();
      break;
    }

    case 'delta': {
      currentTurnMessage();
      state.turn.segment += event.text || '';
      scheduleTurnPaint();
      break;
    }

    case 'text_end': {
      currentTurnMessage();
      if (typeof event.text === 'string' && event.text) state.turn.segment = event.text;
      scheduleTurnPaint();
      break;
    }

    case 'message': {
      const message = event.message;
      if (!message || message.role !== 'assistant') break;

      // 一条 assistant 消息结束：把这一轮文本归档，下一轮继续追加到同一个气泡
      const text = extractText(message);
      const segment = state.turn.segment;
      const finalText = String(text || segment || '').trim();
      if (finalText) state.turn.parts.push(finalText);
      state.turn.segment = '';

      const msg = currentTurnMessage();
      msg.text = composeTurnText();
      paintBubble(msg);
      scrollMessages(false);

      if (message.stopReason === 'error') {
        msg.notice = {
          kind: 'error',
          text: '模型请求失败：' + (message.errorMessage || message.rawStopReason || '未知错误')
        };
        paintNotice(msg);
      }
      break;
    }

    case 'tool': {
      const msg = currentTurnMessage();
      if (event.phase === 'start') {
        msg.tools.push({ id: event.id, name: event.name, arg: event.args });
      } else {
        const tool = msg.tools.find(t => t.id === event.id);
        if (tool) { tool.error = event.isError; tool.ms = event.durationMs; }
      }
      paintTools(msg);
      scrollMessages(false);
      break;
    }

    case 'artifact': {
      const msg = currentTurnMessage();
      if (!msg.artifacts.some(a => a.path === event.artifact.path)) {
        msg.artifacts.push(event.artifact);
        paintArtifacts(msg);
        scrollMessages(false);
      }
      break;
    }

    case 'retry': {
      if (event.phase === 'reset') {
        // 后端换成了新会话，之前失败那轮的内容作废
        const msg = state.turn.msg;
        if (msg) {
          state.turn.parts = [];
          state.turn.segment = '';
          msg.text = '';
          msg.tools = [];
          paintBubble(msg);
          paintTools(msg);
        }
        break;
      }

      const msg = currentTurnMessage();
      if (event.phase === 'start') {
        state.retrying = true;
        state.streaming = true;
        updateSendBtn();
        const seconds = Math.max(1, Math.round((event.delayMs || 0) / 1000));
        msg.notice = {
          kind: 'warn',
          text: '接口繁忙或被限流，' + seconds + ' 秒后进行第 ' + event.attempt + '/' + event.maxAttempts + ' 次重试' +
            (event.errorMessage ? ' · ' + event.errorMessage : '')
        };
      } else if (!event.success) {
        state.retrying = false;
        msg.notice = {
          kind: 'error',
          text: '重试 ' + (event.attempt || 0) + ' 次后仍然失败' + (event.finalError ? '：' + event.finalError : '')
        };
      } else {
        state.retrying = false;
        msg.notice = null;
      }
      paintNotice(msg);
      scrollMessages(false);
      break;
    }

    case 'settled': {
      state.streaming = false;
      state.retrying = false;
      const msg = state.turn.msg;
      if (msg) {
        msg.streaming = false;
        msg.text = composeTurnText();
        paintBubble(msg);
      }
      resetTurn();
      updateSendBtn();
      renderChatHead();
      refreshSessions();

      if (!event.aborted && msg && msg.text.trim()) {
        notifyTaskDone(currentTitle(), shortLine(msg.text, 90)).then(result => {
          if (!result || result.skipped) return;
          const delivered = result.browser === 'ok' || result.system === 'ok';
          if (delivered || state.notifyWarned) return;
          state.notifyWarned = true;
          const detail = [result.browser, result.system].filter(item => item && item !== 'skipped').join('；');
          toast('提醒没发出去：' + detail + '（设置 → 任务提醒 里可测试）', 7000);
        });
      }
      break;
    }

    case 'name': {
      if (state.session) state.session.name = event.name || '';
      $('#chatTitle').textContent = event.name || '新任务';
      break;
    }

    case 'exit': {
      state.streaming = false;
      updateSendBtn();
      renderChatHead();
      toast('Pi 进程已退出' + (event.stderr ? '：' + String(event.stderr).slice(0, 120) : ''));
      break;
    }

    case 'error': {
      toast(event.message || '出错了');
      const msg = state.turn.msg;
      if (msg) {
        msg.notice = { kind: 'error', text: event.message || '出错了' };
        paintNotice(msg);
      }
      break;
    }

    default:
      break;
  }
}

/* ---------------------------------------------------------------- 附件 */

const TEXT_EXT = ['.md', '.markdown', '.txt', '.json', '.csv', '.tsv', '.yaml', '.yml', '.toml', '.log',
  '.js', '.jsx', '.ts', '.tsx', '.py', '.go', '.rs', '.java', '.c', '.cpp', '.h', '.css', '.html', '.sh', '.ps1', '.sql'];

function isTextFile(file) {
  if (file.type && file.type.startsWith('text/')) return true;
  if (file.type === 'application/json') return true;
  const dot = file.name.lastIndexOf('.');
  if (dot < 0) return false;
  return TEXT_EXT.includes(file.name.slice(dot).toLowerCase());
}

function readAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result));
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function addFiles(fileList) {
  const files = Array.from(fileList || []);
  for (const file of files) {
    if (state.attachments.length >= 8) { toast('单条消息最多 8 个附件'); break; }
    if (file.type.startsWith('image/')) {
      if (file.size > 10 * 1024 * 1024) { toast(file.name + ' 超过 10 MB，已跳过'); continue; }
      const preview = await readAsDataUrl(file);
      state.attachments.push({
        kind: 'image',
        name: file.name || 'image.png',
        preview,
        payload: { type: 'image', data: preview.split(',')[1] || '', mimeType: file.type || 'image/png' }
      });
    } else if (isTextFile(file) && file.size <= 2 * 1024 * 1024) {
      const text = await file.text();
      state.attachments.push({ kind: 'text', name: file.name, text });
    } else {
      if (file.size > 50 * 1024 * 1024) { toast(file.name + ' 超过 50 MB，已跳过'); continue; }
      state.attachments.push({ kind: 'file', name: file.name, file });
    }
  }
  renderAttachments();
  updateSendBtn();
}

async function uploadAttachment(file, name) {
  const res = await fetch('/api/upload?sessionId=' + encodeURIComponent(state.sessionId), {
    method: 'POST',
    headers: { 'x-filename': encodeURIComponent(name) },
    body: file
  });
  const data = await res.json().catch(() => ({ ok: false, error: 'HTTP ' + res.status }));
  if (!res.ok || data.ok === false) throw new Error(data.error || '上传失败');
  return data;
}

/* ---------------------------------------------------------------- 发送 */

function autoGrow() {
  const node = $('#input');
  node.style.height = 'auto';
  node.style.height = Math.min(node.scrollHeight, 190) + 'px';
}

async function submit() {
  if (state.streaming) { toast('AI 正在回复中，请稍候'); return; }

  const text = $('#input').value.trim();
  const attachments = state.attachments.slice();
  if (!text && !attachments.length) return;

  state.attachments = [];
  renderAttachments();
  $('#input').value = '';
  autoGrow();
  updateSendBtn();

  state.messages.push({ role: 'user', text, attachments: attachments.map(a => a.name), tools: [], artifacts: [] });
  const userMsg = state.messages[state.messages.length - 1];

  if (!state.sessionId) {
    try {
      // ensureSession 内部会按 state.messages 重建列表，本条已经渲染过了，不能再 append 一次
      await ensureSession();
    } catch (err) {
      state.messages.pop();
      toast('创建会话失败: ' + err.message);
      return;
    }
  } else {
    $('#messages').appendChild(buildMessageNode(userMsg));
    scrollMessages(true);
  }

  try {
    const images = [];
    let composed = text;

    for (const att of attachments) {
      if (att.kind === 'image') {
        images.push(att.payload);
      } else if (att.kind === 'text') {
        composed += '\n\n【附件：' + att.name + '】\n```\n' + att.text.slice(0, 80000) + '\n```';
      } else if (att.file) {
        const uploaded = await uploadAttachment(att.file, att.name);
        composed += '\n\n【附件已保存到：' + uploaded.path + '】请先用 read 工具读取这个文件，再回答问题。';
      }
    }

    state.streaming = true;
    resetTurn();
    updateSendBtn();
    renderChatHead();

    await api('/api/session/' + state.sessionId + '/prompt', {
      method: 'POST',
      body: { message: composed, images }
    });
  } catch (err) {
    state.streaming = false;
    updateSendBtn();
    toast(err.message);
  }
}

/* ---------------------------------------------------------------- 侧栏显隐 */

/* ------------------------------------------------ 侧栏折叠：窄纵向视口自动收起 */

let SIDEBAR_NARROW = null;

// 「窄纵向」：宽度不足 820px（含 Win11 三分屏），或明显竖屏
function isNarrowViewport() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  return w <= 820 || w < h * 0.92;
}

// 按钮是绝对定位，只读 brand-name 的位置，不占布局流，Pi-buddy 文字不会移动
function setSidebar(open) {
  const bar = $('.sidebar');
  const btn = $('#sidebarToggle');
  if (!bar || !btn) return;
  bar.classList.toggle('collapsed', !open);
  btn.classList.toggle('collapsed', !open);
  const label = open ? '收起侧边栏' : '展开侧边栏';
  btn.title = label;
  btn.setAttribute('aria-label', label);
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  const resizer = $('#sidebarResizer');
  if (resizer) resizer.classList.toggle('hidden', !open);
  requestAnimationFrame(layoutHomeLogo);
}

// 只在跨越窄/宽阈值时自动干预；用户手动打开后不会被立刻收回去
function syncSidebarViewport() {
  const narrow = isNarrowViewport();
  if (narrow === SIDEBAR_NARROW) return;
  SIDEBAR_NARROW = narrow;
  setSidebar(!narrow);
}


/* ------------------------------------------------ 侧栏宽度：拖动右侧边调整 */

const SIDEBAR_MIN = 200;

function currentSidebarWidth() {
  const app = $('.app');
  const raw = app && parseFloat(app.style.getPropertyValue('--sidebar-w'));
  return (raw && isFinite(raw)) ? raw : 252;
}

// 上限为窗口宽度的 75%；不传 px 时按当前值重新夹取（窗口 resize 时用）
function setSidebarWidth(px, persist) {
  const app = $('.app');
  if (!app) return 252;
  const max = Math.round(window.innerWidth * 0.75);
  const min = Math.min(SIDEBAR_MIN, max);
  const raw = (typeof px === 'number' && isFinite(px)) ? px : currentSidebarWidth();
  const w = Math.max(min, Math.min(Math.round(raw), max));
  app.style.setProperty('--sidebar-w', w + 'px');
  requestAnimationFrame(layoutHomeLogo);
  if (persist) saveSettings({ ui: { sidebarWidth: w } });
  return w;
}

function bindSidebarResizer() {
  const handle = $('#sidebarResizer');
  const bar = $('.sidebar');
  if (!handle || !bar) return;
  let startX = 0, startW = 0, dragging = false;

  handle.addEventListener('pointerdown', event => {
    if (bar.classList.contains('collapsed')) return;
    dragging = true;
    startX = event.clientX;
    startW = bar.getBoundingClientRect().width;
    try { handle.setPointerCapture(event.pointerId); } catch { /* 某些环境不支持捕获 */ }
    handle.classList.add('dragging');
    document.body.classList.add('resizing');
    event.preventDefault();
  });

  handle.addEventListener('pointermove', event => {
    if (!dragging) return;
    setSidebarWidth(startW + (event.clientX - startX), false);
  });

  const finish = () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.classList.remove('resizing');
    setSidebarWidth(undefined, true);
  };
  handle.addEventListener('pointerup', finish);
  handle.addEventListener('pointercancel', finish);
}


function applySidebarVisibility() {
  const sidebar = (currentApp().ui || {}).sidebar || {};
  const map = { assistant: 'assistant', hub: 'experts', cron: 'cron', library: 'library' };
  $$('#nav .nav-item').forEach(item => {
    const key = map[item.dataset.view];
    if (!key) return;
    item.classList.toggle('hidden', sidebar[key] === false);
  });

  const sideScroll = $('.side-scroll');
  if (!sideScroll) return;
  const heads = $$('.list-head', sideScroll);
  if (heads[0]) heads[0].classList.toggle('hidden', sidebar.tasks === false);
  if (heads[1]) heads[1].classList.toggle('hidden', sidebar.spaces === false);
  const taskList = $('#taskList');
  const spaceList = $('#spaceList');
  if (taskList && sidebar.tasks === false) taskList.classList.add('hidden');
  else if (taskList) taskList.classList.remove('hidden');
  if (spaceList && sidebar.spaces === false) spaceList.classList.add('hidden');
  else if (spaceList) spaceList.classList.remove('hidden');
}

/* ---------------------------------------------------------------- 绑定 */

function bindStatic() {
  $('#btnNew').onclick = newTask;

  $$('#nav .nav-item').forEach(item => {
    item.onclick = () => {
      if (item.disabled) return;
      const view = item.dataset.view;
      if (view === 'more') { showMoreMenu(); return; }
      if (view === 'hub' || view === 'cron' || view === 'library') {
        state.panel = view;
        if (view === 'library') loadLibrary().then(() => { renderPanel(); switchView('panel'); });
        else { renderPanel(); switchView('panel'); }
      }
    };
  });

  $('#btnPlus').onclick = () => showPlusMenu('root');
  $('#btnModel').onclick = showModelMenu;
  $('#btnSend').onclick = () => {
    if (state.streaming) abortSession();
    else submit();
  };
  $('#btnAbort').onclick = abortSession;

  $('#input').addEventListener('input', () => { autoGrow(); updateSendBtn(); });
  $('#input').addEventListener('keydown', event => {
    if (event.key !== 'Enter' || event.isComposing) return;

    // Ctrl / Cmd + Enter：显式插入换行
    if (event.ctrlKey || event.metaKey) {
      event.preventDefault();
      const node = event.target;
      const start = node.selectionStart;
      const end = node.selectionEnd;
      node.value = node.value.slice(0, start) + '\n' + node.value.slice(end);
      node.selectionStart = start + 1;
      node.selectionEnd = start + 1;
      autoGrow();
      updateSendBtn();
      return;
    }

    // Shift + Enter 交给浏览器默认换行
    if (event.shiftKey) return;

    event.preventDefault();
    submit();
  });
  $('#input').addEventListener('focus', () => $('#composer').classList.add('focus'));
  $('#input').addEventListener('blur', () => $('#composer').classList.remove('focus'));
  $('#input').addEventListener('paste', event => {
    const items = event.clipboardData && event.clipboardData.items;
    if (!items) return;
    const files = [];
    for (const item of items) {
      if (item.kind === 'file') {
        const file = item.getAsFile();
        if (file) files.push(file);
      }
    }
    if (files.length) { event.preventDefault(); addFiles(files); }
  });

  const composer = $('#composer');
  composer.addEventListener('dragover', event => { event.preventDefault(); composer.classList.add('drag'); });
  composer.addEventListener('dragleave', () => composer.classList.remove('drag'));
  composer.addEventListener('drop', event => {
    event.preventDefault();
    composer.classList.remove('drag');
    if (event.dataTransfer && event.dataTransfer.files) addFiles(event.dataTransfer.files);
  });

  $('#filePicker').addEventListener('change', event => {
    addFiles(event.target.files);
    event.target.value = '';
  });

  $('#btnFolder').onclick = async () => {
    const target = await pickFolder(state.folder || (state.boot && state.boot.home) || '');
    if (target === null) return;              // 点取消：保持原样
    state.folder = target || null;            // 空串表示「不指定」
    updateFolderText();
    toast(state.folder ? '工作文件夹：' + state.folder : '已取消工作文件夹，将使用用户主目录');
  };

  $('#btnClearFolder').onclick = () => {
    state.folder = null;
    updateFolderText();
    toast('已取消工作文件夹，将使用用户主目录');
  };

  $('#fullAccess').addEventListener('change', event => {
    state.fullAccess = event.target.checked;
    updateSendBtn();
    if (state.fullAccess) toast('完全访问权限已开：新会话将信任项目内文件');
    else toast('完全访问权限已关：新会话不信任项目内文件');
  });

  $('#btnAddSpace').onclick = async () => {
    const target = await pickFolder(state.folder || (state.boot && state.boot.home) || '');
    if (!target) return;
    const app = currentApp();
    const spaces = (app.spaces || []).slice();
    if (!spaces.some(s => s.path === target)) {
      spaces.push({ name: target.split(/[\\/]/).filter(Boolean).pop() || target, path: target });
      await saveSettings({ spaces });
      renderSidebar();
      toast('已添加空间');
    }
  };

  const sidebarToggle = $('#sidebarToggle');
  if (sidebarToggle) {
    sidebarToggle.addEventListener('click', () => setSidebar(sidebarToggle.classList.contains('collapsed')));
  }

  window.addEventListener('resize', () => { closePopover(); syncSidebarViewport(); setSidebarWidth(undefined, false); layoutHomeLogo(); });

  // 输入框尺寸变化（换行、附件、示例气泡增删）时重算 logo
  if (typeof ResizeObserver !== 'undefined') {
    const inputEl = $('#composer');
    if (inputEl) new ResizeObserver(() => layoutHomeLogo()).observe(inputEl);
  }
}

/* ---------------------------------------------------------------- 启动 */

async function bootstrap() {
  try {
    const data = await api('/api/bootstrap');
    state.boot = data;
    state.markdown = ((data.app.ui || {}).markdown) !== false;
    // 语言跟随系统：简体/繁体中文都走中文界面，其它一律英文
    const sysLang = (navigator.languages && navigator.languages[0]) || navigator.language || '';
    state.lang = /^zh/i.test(sysLang) ? 'zh' : 'en';
    state.retry = data.retry || { enabled: true, maxRetries: 3, baseDelayMs: 2000, maxAgentDelayMs: 60000 };

    // 恢复上次用过的模型；找不到（被删了）就回到默认
    const lastModel = data.lastModel || (data.app && data.app.lastModel);
    if (lastModel && lastModel.id) {
      const models = data.models || [];
      state.model = models.find(m => m.provider === lastModel.provider && m.id === lastModel.id)
        || models.find(m => m.id === lastModel.id)
        || null;
    }

    $('#verText').textContent = 'v' + data.version.app;
    $('#verText').title = 'Pi ' + data.version.pi;

    bindStatic();
    syncSidebarViewport();
    setSidebarWidth(((currentApp().ui || {}).sidebarWidth) || 252, false);
    bindSidebarResizer();
    renderHomeLogo();
    renderPiMissing();
    applySidebarVisibility();
    renderSidebar();
    renderPresets();
    renderSamples();
    renderChips();
    renderAttachments();
    renderModelButton();
    updateFolderText();
    updateSendBtn();
    switchView('welcome');
    startI18n();
    startAliveProbe();

  } catch (err) {
    toast('初始化失败: ' + err.message);
  }
}

bootstrap();
</script>
